
<div class="login-page">

  <div class="login-decoration decoration-one"></div>
  <div class="login-decoration decoration-two"></div>

  <div class="login-card">

    <div class="login-logo">
      🎬
    </div>

    <h2>Bienvenido a CineMet</h2>

    <p class="login-subtitle">
      Inicia sesión y organiza tu próxima maratón.
    </p>

    <form (ngSubmit)="ingresar()">

      <div class="mb-4">
        <label class="form-label">
          Correo electrónico
        </label>

        <input
          type="email"
          class="form-control cine-input"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="ejemplo@cinemet.com">
      </div>

      <div class="mb-4">
        <label class="form-label">
          Contraseña
        </label>

        <input
          type="password"
          class="form-control cine-input"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Ingresa tu contraseña">
      </div>

      @if (error) {
        <div class="alert alert-danger">
          {{ error }}
        </div>
      }

      <button type="submit" class="btn-cine w-100">
        Iniciar sesión →
      </button>

    </form>

    <div class="login-bottom">
      <span>🎞️</span>
      Tu próxima historia comienza aquí.
    </div>

  </div>
</div>
